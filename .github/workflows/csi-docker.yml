name: CSI Docker Build and Push

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  # Releases are immutable, so a failed tag run can't be re-triggered by
  # re-pushing the tag. Dispatch with a tag input rebuilds that release's
  # image from the current workflow definition.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and push (e.g. v2.0.0)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zerofs-csi
  VALIDATION_BASE_IMAGE: ghcr.io/barre/zerofs@sha256:3ec09262cba72ec84d12a9f64e796a2cb607c962c2b94e3704c14cde7102e2e0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate container workflow contract
        run: python3 -m unittest scripts.tests.test_csi_docker_workflow

      - name: Plan container build event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/ci/container_build_event.py \
            --event-name "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --input-tag "$INPUT_TAG"

  build-binaries:
    name: Build zerofs-csi ${{ matrix.arch }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-tags: true

      - name: Verify release checkout
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.0
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked

      - name: Build
        working-directory: zerofs
        run: cross build --profile ci -p zerofs-csi --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          mkdir -p artifacts
          cp zerofs/target/${{ matrix.target }}/ci/zerofs-csi artifacts/zerofs-csi-linux-${{ matrix.arch }}
          chmod +x artifacts/zerofs-csi-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerofs-csi-linux-${{ matrix.arch }}
          path: artifacts/zerofs-csi-linux-${{ matrix.arch }}

  validate-image:
    name: Validate image
    needs: [plan, build-binaries]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zerofs-csi-linux-*
          merge-multiple: true
          path: image-context

      - name: Prepare build context
        run: |
          cp zerofs/zerofs-csi/Dockerfile image-context/
          ls -la image-context

      - name: Validate Docker images
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: image-context
          file: image-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ZEROFS_IMAGE=${{ env.VALIDATION_BASE_IMAGE }}
          push: false
          tags: zerofs-csi:validation
          provenance: true
          sbom: true

  publish-image:
    name: Publish image
    needs: [plan, build-binaries]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-tags: true

      - name: Verify release checkout
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zerofs-csi-linux-*
          merge-multiple: true
          path: image-context

      - name: Prepare build context
        run: |
          cp zerofs/zerofs-csi/Dockerfile image-context/
          ls -la image-context

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release base image
        id: base
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          base="${REGISTRY}/${IMAGE_OWNER}/zerofs:${RELEASE_TAG#v}"
          base=$(echo "$base" | tr '[:upper:]' '[:lower:]')
          echo "Waiting for base image $base"
          for _ in $(seq 1 60); do
            if docker manifest inspect "$base" > /dev/null 2>&1; then
              echo "Base image available"
              echo "image=$base" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for $base" >&2
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            type=sha

      - name: Build and push Docker images
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: image-context
          file: image-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ZEROFS_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

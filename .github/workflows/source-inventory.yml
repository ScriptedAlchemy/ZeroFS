name: Source inventory

on:
  pull_request:
    # Lane PRs into the integration branch are gated locally and by its own PR; run the matrix once there.
    branches: ["main", "develop"]
    paths:
      - "zerofs/**"
      - ".github/workflows/source-inventory.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "zerofs/**"
      - ".github/workflows/source-inventory.yml"
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory with Linux mount boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: zerofs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libfuse3-dev pkg-config
      - name: Build inventory tests
        run: cargo test --locked -p zerofs --lib --no-run --message-format=json > inventory-build.jsonl
      - name: Run inventory tests as the runner user
        run: cargo test --locked -p zerofs --lib cli::inventory -- --nocapture
      - name: Run inventory bind mounts and device nodes as root
        run: |
          set -euo pipefail
          binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "zerofs" and .target.kind == ["lib"] and .profile.test and .executable != null) | .executable' inventory-build.jsonl)"
          test -x "$binary"
          sudo env ZEROFS_INVENTORY_BIND_MOUNT_TEST=1 unshare --mount --propagation private "$binary" cli::inventory::tests::review_same_device_bind_mount_is_not_traversed --exact --ignored --nocapture

  inventory-macos:
    name: Inventory on macOS
    # GitHub cancelled this job on four pushes in one day for lack of a macOS arm64
    # runner, which left a failed check that said nothing about the code. It runs daily,
    # on main and develop, and on request, so a shortage cannot mark a pull request red.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # Running these fixture tests in parallel panicked the macOS 27.2 kernel twice on a
    # many-core developer Mac. The tests serialize on a shared fixture lock, and this job
    # also runs one test thread. The timeout ends a wedged runner instead of letting it
    # hold the six-hour default.
    timeout-minutes: 45
    env:
      # Apple silicon uses 16 KiB pages, as in the aarch64-apple-darwin cross-compile build.
      JEMALLOC_SYS_WITH_LG_PAGE: "16"
    defaults:
      run:
        working-directory: zerofs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build inventory tests
        run: cargo test --locked -p zerofs --lib --no-run
      - name: Run inventory tests on one thread
        timeout-minutes: 20
        run: cargo test --locked -p zerofs --lib cli::inventory -- --test-threads=1 --nocapture

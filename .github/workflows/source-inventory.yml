name: Source inventory

on:
  pull_request:
    paths:
      - "zerofs/**"
      - ".github/workflows/source-inventory.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "zerofs/**"
      - ".github/workflows/source-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory with Linux mount boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: zerofs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libfuse3-dev pkg-config
      - name: Build inventory tests
        run: cargo test --locked -p zerofs --lib --no-run --message-format=json > inventory-build.jsonl
      - name: Run inventory tests as the runner user
        run: cargo test --locked -p zerofs --lib cli::inventory -- --nocapture
      - name: Run inventory bind mounts and device nodes as root
        run: |
          set -euo pipefail
          binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "zerofs" and .target.kind == ["lib"] and .profile.test and .executable != null) | .executable' inventory-build.jsonl)"
          test -x "$binary"
          sudo env ZEROFS_INVENTORY_BIND_MOUNT_TEST=1 unshare --mount --propagation private "$binary" cli::inventory::tests::review_same_device_bind_mount_is_not_traversed --exact --ignored --nocapture

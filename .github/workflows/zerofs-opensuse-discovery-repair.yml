name: ZeroFS openSUSE repair discovery
on:
  push:
    branches: [codex/zerofs-ci-opensuse-refresh]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install discovery runtime
        run: zypper --non-interactive install --no-recommends python3
      - name: Discover the maintained openSUSE target
        run: |
          python3 packaging/kernel/kernel-targets.py \
            --manifest packaging/kernel/targets.json \
            discover opensuse-tumbleweed-default-x86-64 \
            --as-of 2026-10-04T03:31:00Z \
            --output opensuse-candidate.json
          cat opensuse-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opensuse-repair-candidate
          path: opensuse-candidate.json
          if-no-files-found: error

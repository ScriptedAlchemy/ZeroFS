name: kernel-compile-nfs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  kernel-compile-nfs:
    name: Compile Linux Kernel on NFS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test the bounded NFS diagnostic collector
        run: python3 -m unittest discover -s scripts/tests -p test_nfs_ci_diagnostics.py -v

      - name: Build pinned MinIO fixture
        uses: ./.github/actions/build-minio-fixture
        with:
          docker-image: 'true'

      - name: Start MinIO
        run: |
          sudo docker load --input "$GITHUB_WORKSPACE/ci-minio-image.tar"
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            zerofs-minio-ci:local server /data

          # Wait for MinIO to be ready
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "MinIO failed to start after 30s" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common build-essential libncurses-dev bison flex libssl-dev libelf-dev bc tcpdump

      - name: Setup MinIO bucket
        run: |
          # Install mc (MinIO client)
          chmod +x mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin
          ./mc mb myminio/zerofs-test || true

      - name: Fetch the prebuilt ZeroFS binary
        uses: actions/download-artifact@v4
        with:
          name: zerofs-ci-bin
          path: zerofs/target/ci
      - run: chmod +x zerofs/target/ci/zerofs

      - name: Start ZeroFS
        working-directory: zerofs
        run: |
          # Create cache directory
          mkdir -p /tmp/zerofs-cache

          # Create ZeroFS configuration
          cat > zerofs-ci.toml << EOF
          [cache]
          dir = "/tmp/zerofs-cache"
          disk_size_gb = 5.0
          memory_size_gb = 2.0

          [storage]
          url = "s3://zerofs-test/test"
          encryption_password = "test-password-123"

          [servers.nfs]
          addresses = ["127.0.0.1:2049"]

          [aws]
          access_key_id = "minioadmin"
          secret_access_key = "minioadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [telemetry]
          enabled = false
          EOF

          # Keep the server's output attached to runner-local storage, not to
          # an earlier Actions step's pipe that is no longer being consumed.
          mkdir -p "$RUNNER_TEMP/zerofs-nfs-diagnostics"
          RUST_LOG=info,zerofs::nfs=debug ./target/ci/zerofs run -c zerofs-ci.toml \
            > "$RUNNER_TEMP/zerofs-nfs-server.log" 2>&1 &

          # Save PID for stats collection
          echo $! > /tmp/zerofs.pid

          # Wait for ZeroFS to start
          echo "Waiting for ZeroFS to start..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 2049; then
              echo "ZeroFS is ready"
              break
            fi
            sleep 1
          done

          # Verify ZeroFS is running
          if ! nc -z 127.0.0.1 2049; then
            echo "ZeroFS failed to start"
            exit 1
          fi

      - name: Capture bounded loopback NFS RPC evidence
        run: |
          set -euo pipefail
          capture_dir="$RUNNER_TEMP/zerofs-nfs-diagnostics"
          mkdir -p "$capture_dir"
          # Only this disposable runner's loopback NFS traffic. Four 4 MB
          # rotating files retain RPC headers without recording full payloads.
          sudo sh -c '
            echo $$ > "$1/capture.pid"
            exec tcpdump -Z root -i lo -U -s 256 -C 4 -W 4 \
              -w "$1/rpc.pcap" "tcp port 2049"
          ' sh "$capture_dir" > "$capture_dir/tcpdump.log" 2>&1 &
          for attempt in {1..20}; do
            if [ -s "$capture_dir/capture.pid" ]; then
              capture_pid=$(cat "$capture_dir/capture.pid")
              if [ "$(cat "/proc/$capture_pid/comm" 2>/dev/null)" = tcpdump ]; then
                break
              fi
            fi
            sleep 0.1
          done
          test -s "$capture_dir/capture.pid"
          capture_pid=$(cat "$capture_dir/capture.pid")
          test "$(cat "/proc/$capture_pid/comm")" = tcpdump

      - name: Mount NFS
        run: |
          # Create mount point
          sudo mkdir -p /mnt/zerofs

          # Mount ZeroFS via NFS
          sudo mount -t nfs -o vers=3,async,nolock,rsize=1048576,wsize=1048576,tcp,port=2049,mountport=2049,hard 127.0.0.1:/ /mnt/zerofs

          # Verify mount
          mount | grep zerofs

      - name: Check disk space
        run: df -h

      - name: Download and unpack Linux kernel on NFS
        run: |
          set -euo pipefail

          # Keep the network transfer and archive validation off the mounted
          # filesystem; the complete kernel source is still unpacked onto NFS
          # and compiled there, with no change to the workload or assertions.
          archive="${RUNNER_TEMP}/linux-7.2-rc1.tar.gz"
          url="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/snapshot/linux-7.2-rc1.tar.gz"
          echo "Fetching kernel archive to runner-local scratch"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 30 --output "$archive" "$url"
          test -s "$archive"
          gzip -t "$archive"
          echo "Kernel archive verified: $(stat -c %s "$archive") bytes"
          echo "Extracting complete kernel source on the ZeroFS NFS mount"

          # The previous NFS extraction ran silently for nearly six hours
          # before cancellation. Report process/blocking state periodically,
          # without probing a potentially D-state-blocked hard mount.
          (
            while sleep 120; do
              echo "NFS extraction diagnostic: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              ps -eo pid,ppid,stat,wchan:32,etime,pcpu,comm |
                awk 'NR == 1 || $NF == "tar" || $NF == "gzip" || $NF == "zerofs"'
              # /proc reads never traverse the mounted test filesystem.
              # Preserve retransmit/COMMIT counters and actual kernel stacks,
              # not just the last wait-channel name in a six-hour log.
              timeout --kill-after=2s 10s sudo python3 scripts/nfs_ci_diagnostics.py \
                --output "$RUNNER_TEMP/zerofs-nfs-diagnostics/snapshots.jsonl" \
                || echo "NFS diagnostic snapshot failed; workload status remains authoritative"
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          tar -xzf "$archive" -C /mnt/zerofs \
            --checkpoint=20000 \
            --checkpoint-action='echo=tar archive checkpoint %u'
          kill "$monitor_pid" 2>/dev/null || true
          trap - EXIT

          test -s /mnt/zerofs/linux-7.2-rc1/Makefile
          echo "Kernel source extraction on NFS completed"

      - name: Compile kernel
        run: |
          cd /mnt/zerofs/linux-7.2-rc1

          # Configure with tinyconfig for minimal build
          make tinyconfig

          # Show config size
          echo "Config size: $(wc -l < .config) lines"

          # Time the compilation
          echo "Starting kernel compilation with $(nproc) cores..."
          time make -j$(nproc) 2>&1 | tee /tmp/kernel-build.log

          # Check if vmlinux was created
          if [ -f vmlinux ]; then
            echo "Kernel compilation successful!"
            ls -lh vmlinux
          else
            echo "Kernel compilation failed!"
            exit 1
          fi

      - name: Preserve NFS failure evidence before unmount
        if: always()
        run: |
          capture_dir="$RUNNER_TEMP/zerofs-nfs-diagnostics"
          mkdir -p "$capture_dir"
          timeout --kill-after=2s 10s sudo python3 scripts/nfs_ci_diagnostics.py \
            --output "$capture_dir/snapshots.jsonl" || true
          if [ -s "$capture_dir/capture.pid" ]; then
            capture_pid=$(cat "$capture_dir/capture.pid")
            # Stop only the capture process owned by this job, never an
            # unrelated process or a workload blocked in kernel I/O.
            if [[ "$capture_pid" =~ ^[0-9]+$ ]] && \
               [ "$(cat "/proc/$capture_pid/comm" 2>/dev/null)" = tcpdump ] && \
               sudo grep -zFq -- "$capture_dir/rpc.pcap" "/proc/$capture_pid/cmdline"; then
              sudo kill -INT "$capture_pid" || true
            fi
          fi
          tail -c 16777216 "$RUNNER_TEMP/zerofs-nfs-server.log" \
            > "$capture_dir/server-tail.log" 2>/dev/null || true
          tail -c 4194304 /tmp/kernel-build.log \
            > "$capture_dir/kernel-build-tail.log" 2>/dev/null || true
          sudo dmesg --ctime | tail -n 2000 > "$capture_dir/dmesg.log" || true
          timeout --kill-after=2s 10s sudo ss -tinp \
            > "$capture_dir/tcp-state.log" 2>&1 || true
          sudo chmod -R a+rX "$capture_dir"

      - name: Upload NFS kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfs-kernel-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zerofs-nfs-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          # Unmount
          sudo umount /mnt/zerofs || true

          # Kill ZeroFS
          if [ -f /tmp/zerofs.pid ]; then
            kill $(cat /tmp/zerofs.pid) || true
          fi
          pkill -f "zerofs run -c zerofs-ci.toml" || true

  kernel-compile-nfs-tiered:
    name: Compile Linux Kernel on NFS (tiered volatile_memory+ssd)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common build-essential libncurses-dev bison flex libssl-dev libelf-dev bc xz-utils

      - name: Fetch the prebuilt ZeroFS binary
        uses: actions/download-artifact@v4
        with:
          name: zerofs-ci-bin
          path: zerofs/target/ci
      - run: chmod +x zerofs/target/ci/zerofs

      - name: Build pinned MinIO fixture
        uses: ./.github/actions/build-minio-fixture
        with:
          docker-image: 'true'

      - name: Start MinIO
        run: |
          sudo docker load --input "$GITHUB_WORKSPACE/ci-minio-image.tar"
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            zerofs-minio-ci:local server /data

          # Wait for MinIO to be ready
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "MinIO failed to start after 30s" >&2
              exit 1
            fi
            sleep 1
          done

          # Install mc (MinIO client)
          chmod +x mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin
          ./mc mb myminio/zerofs-test || true

      - name: Prepare the tiered run roots
        run: |
          RUN_UUID=$(python3 -c "import uuid; print(uuid.uuid4())")
          CONTROL_ROOT="/var/tmp/zerofs-tiered-control-${RUN_UUID}"
          RESOURCE_ROOT="/var/tmp/zerofs-tiered-resources-${RUN_UUID}"
          {
            echo "RUN_UUID=${RUN_UUID}"
            echo "CONTROL_ROOT=${CONTROL_ROOT}"
            echo "RESOURCE_ROOT=${RESOURCE_ROOT}"
            echo "LEDGER=${CONTROL_ROOT}/ledger.json"
          } >> "$GITHUB_ENV"

      - name: Write the tiered ZeroFS config
        run: |
          cat > /tmp/zerofs-tiered.toml << EOF
          [cache]
          dir = "${RESOURCE_ROOT}/run/cache"
          disk_size_gb = 5.0
          memory_size_gb = 1.0

          [storage]
          url = "s3://zerofs-test/zerofs-tiered/${RUN_UUID}"
          encryption_password = "test-password-123"

          [filesystem]
          write_ack_mode = "volatile_memory"
          volatile_memory_gb = 1.0

          [writeback]
          enabled = true
          dir = "${RESOURCE_ROOT}/run/writeback"
          ack_mode = "ssd"
          memory_size_gb = 1.0
          disk_size_gb = 8.0

          [servers.nfs]
          addresses = ["127.0.0.1:12049"]

          [aws]
          access_key_id = "minioadmin"
          secret_access_key = "minioadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [telemetry]
          enabled = false
          EOF

      - name: Set up the tiered harness run
        run: |
          python3 scripts/tiered-writeback-e2e.py setup \
            --run-uuid "$RUN_UUID" \
            --filesystem-ack-mode volatile_memory \
            --object-ack-mode ssd \
            --zerofs-binary "$GITHUB_WORKSPACE/zerofs/target/ci/zerofs" \
            --zerofs-config /tmp/zerofs-tiered.toml
          mkdir -p "${RESOURCE_ROOT}/run/cache" "${RESOURCE_ROOT}/run/writeback"

      - name: Run the tiered kernel-compile scenario
        run: |
          # Plan-only until the observed-durability collector is wired:
          # run_scenario fails closed on requires_observed_durability.
          python3 scripts/tiered-writeback-e2e.py run \
            --plan-only \
            --ledger "$LEDGER" \
            --scenario kernel-compile-nfs \
            --filesystem-ack-mode volatile_memory \
            --object-ack-mode ssd \
            --zerofs-binary "$GITHUB_WORKSPACE/zerofs/target/ci/zerofs" \
            --zerofs-config /tmp/zerofs-tiered.toml

      - name: Clean up the tiered run
        if: always()
        run: |
          if [ -f "$LEDGER" ]; then
            python3 scripts/tiered-writeback-e2e.py cleanup --ledger "$LEDGER"
            python3 scripts/tiered-writeback-e2e.py cleanup --ledger "$LEDGER"
            python3 scripts/tiered-writeback-e2e.py assert-clean --ledger "$LEDGER"
          fi

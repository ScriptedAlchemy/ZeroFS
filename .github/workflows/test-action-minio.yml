name: Test ZeroFS Action with MinIO

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

env:
  # Match the source-built tools already validated by release-pgo.yml.
  MINIO_VERSION: 7aac2a2c5b7c882e68c1ce017d8256be2feea27f
  MINIO_MC_VERSION: 77f82e18b5401a65958f1619df6ebb994634bd88

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-with-minio:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Build pinned MinIO tools
        run: |
          go install "github.com/minio/minio@${MINIO_VERSION}"
          go install "github.com/minio/mc@${MINIO_MC_VERSION}"

      - name: Start MinIO
        run: |
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            minio server "$RUNNER_TEMP/minio-data" > "$RUNNER_TEMP/minio.log" 2>&1 &

          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            sleep 1
          done
          curl --fail http://localhost:9000/minio/health/live

      - name: Setup MinIO bucket
        run: |
          mc alias set myminio http://localhost:9000 minioadmin minioadmin
          mc mb myminio/test-bucket

      - name: Setup ZeroFS Volume
        id: setup-zerofs
        uses: ./
        with:
          object-store-url: "s3://test-bucket/github-actions-test"
          encryption-password: "test-password-123"
          aws-access-key-id: "minioadmin"
          aws-secret-access-key: "minioadmin"
          aws-endpoint: "http://localhost:9000"
          aws-allow-http: "true"
          aws-region: "us-east-1"
          cache-size-gb: "1"
          mount-path: "/mnt/zerofs-test"

      - name: Test Volume Operations
        run: |
          echo "Testing ZeroFS volume on ${{ matrix.os }}..."

          # Use the mount path from the action output
          MOUNT_PATH="${{ steps.setup-zerofs.outputs.mount-path }}"
          if [ -z "$MOUNT_PATH" ]; then
            MOUNT_PATH="/mnt/zerofs-test"
          fi

          sudo mkdir -p "$MOUNT_PATH/test-dir"
          echo "Hello from GitHub Actions on ${{ matrix.os }}!" | sudo tee "$MOUNT_PATH/test-dir/test.txt"
          sudo cat "$MOUNT_PATH/test-dir/test.txt"
          sudo ls -la "$MOUNT_PATH/test-dir/"
          echo "Tests passed!"

name: xfstests-nfs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  xfstests:
    name: Run xfstests NFS Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize retained evidence
        run: mkdir -p "$RUNNER_TEMP/zerofs-xfstests-nfs"

      - name: "Disk space cleanup"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr automake bc dbench dump e2fsprogs fio gawk \
            gcc git indent libacl1-dev libaio-dev libcap-dev libgdbm-dev libtool \
            libtool-bin liburing-dev libuuid1 lvm2 make psmisc python3 quota sed \
            uuid-dev uuid-runtime xfsprogs linux-headers-$(uname -r) sqlite3 \
            libgdbm-compat-dev nfs-common
          sudo apt-get install -y exfatprogs f2fs-tools ocfs2-tools udftools xfsdump \
            xfslibs-dev || true
          sudo apt-get install -y systemd-coredump systemd jq pkg-config

      - name: Clone xfstests
        run: |
          git clone https://github.com/Barre/xfstests.git /tmp/xfstests
          bash scripts/ci/xfstests-gnu-tools.sh /tmp/xfstests

      - name: Build xfstests
        working-directory: /tmp/xfstests
        run: |
          make
          sudo make install

      - name: Fetch the prebuilt ZeroFS binary
        uses: actions/download-artifact@v4
        with:
          name: zerofs-ci-bin
          path: zerofs/target/ci
      - run: chmod +x zerofs/target/ci/zerofs

      - name: Build pinned MinIO fixture
        uses: ./.github/actions/build-minio-fixture
        with:
          docker-image: 'true'

      - name: Start MinIO
        run: |
          sudo docker load --input "$GITHUB_WORKSPACE/ci-minio-image.tar"
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            zerofs-minio-ci:local server /data

          # Wait for MinIO to be ready
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "MinIO failed to start after 30s" >&2
              exit 1
            fi
            sleep 1
          done

          # The TEST and SCRATCH instances share one bucket under distinct prefixes.
          chmod +x mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin
          ./mc mb myminio/zerofs-test || true

          mkdir -p /tmp/zerofs-cache-test
          mkdir -p /tmp/zerofs-cache-scratch

      - name: Start ZeroFS (TEST instance)
        working-directory: zerofs
        run: |
          # Create ZeroFS configuration for TEST
          cat > zerofs-test.toml << EOF
          [cache]
          dir = "/tmp/zerofs-cache-test"
          disk_size_gb = 1.0
          memory_size_gb = 1.0

          [storage]
          url = "s3://zerofs-test/test"
          encryption_password = "test-password-123"

          [aws]
          access_key_id = "minioadmin"
          secret_access_key = "minioadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [servers.nfs]
          addresses = ["127.0.0.1:2049"]

          [telemetry]
          enabled = false
          EOF

          # Start ZeroFS in the background
          ./target/ci/zerofs run -c zerofs-test.toml > "$RUNNER_TEMP/zerofs-xfstests-nfs/zerofs-test.log" 2>&1 &
          echo $! > /tmp/zerofs-test.pid

          # Wait for ZeroFS to start
          echo "Waiting for ZeroFS TEST instance to start..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 2049; then
              echo "ZeroFS TEST instance is ready"
              break
            fi
            sleep 1
          done

          if ! nc -z 127.0.0.1 2049; then
            echo "ZeroFS TEST instance failed to start"
            tail -n 200 "$RUNNER_TEMP/zerofs-xfstests-nfs/zerofs-test.log" || true
            exit 1
          fi

      - name: Start ZeroFS (SCRATCH instance)
        working-directory: zerofs
        run: |
          # Create ZeroFS configuration for SCRATCH
          cat > zerofs-scratch.toml << EOF
          [cache]
          dir = "/tmp/zerofs-cache-scratch"
          disk_size_gb = 1.0
          memory_size_gb = 1.0

          [storage]
          url = "s3://zerofs-test/scratch"
          encryption_password = "test-password-123"

          [aws]
          access_key_id = "minioadmin"
          secret_access_key = "minioadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [servers.nfs]
          addresses = ["127.0.0.1:20499"]

          [telemetry]
          enabled = false
          EOF

          # Start ZeroFS in the background
          ./target/ci/zerofs run -c zerofs-scratch.toml > "$RUNNER_TEMP/zerofs-xfstests-nfs/zerofs-scratch.log" 2>&1 &
          echo $! > /tmp/zerofs-scratch.pid

          # Wait for ZeroFS to start
          echo "Waiting for ZeroFS SCRATCH instance to start..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 20499; then
              echo "ZeroFS SCRATCH instance is ready"
              break
            fi
            sleep 1
          done

          if ! nc -z 127.0.0.1 20499; then
            echo "ZeroFS SCRATCH instance failed to start"
            tail -n 200 "$RUNNER_TEMP/zerofs-xfstests-nfs/zerofs-scratch.log" || true
            exit 1
          fi

      - name: Create mount points
        run: |
          sudo mkdir -p /mnt/test
          sudo mkdir -p /mnt/scratch

      - name: Configure xfstests
        working-directory: /tmp/xfstests
        run: |
          cat > local.config << 'EOF'
          export FSTYP=nfs

          export TEST_DIR=/mnt/test
          export SCRATCH_MNT=/mnt/scratch

          export TEST_DEV=localhost:/
          export SCRATCH_DEV=127.0.0.1:/

          export TEST_FS_MOUNT_OPTS="-o nolock,tcp,port=2049,mountport=2049,hard"
          export NFS_MOUNT_OPTIONS="-o nolock,tcp,port=20499,mountport=20499,hard"
          EOF

          cat > excludes << 'EOF'
          generic/035
          generic/126
          generic/394
          generic/467
          generic/263
          generic/759
          generic/760
          generic/477
          generic/564
          generic/633
          generic/696
          generic/591
          generic/615
          EOF

      - name: Run xfstests
        working-directory: /tmp/xfstests
        run: |
          set -euo pipefail
          sudo ./check -g quick -E excludes 2>&1 | tee "$RUNNER_TEMP/zerofs-xfstests-nfs/xfstests.log"

      - name: Cleanup
        if: always()
        run: |
          # Unmount filesystems
          sudo umount /mnt/test || true
          sudo umount /mnt/scratch || true

          # Kill ZeroFS instances
          if [ -f /tmp/zerofs-test.pid ]; then
            kill $(cat /tmp/zerofs-test.pid) || true
          fi
          if [ -f /tmp/zerofs-scratch.pid ]; then
            kill $(cat /tmp/zerofs-scratch.pid) || true
          fi
          pkill -f "zerofs-test.toml" || true
          pkill -f "zerofs-scratch.toml" || true

      - name: Collect xfstests evidence
        if: always()
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zerofs-xfstests-nfs"
          checkout_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || printf unavailable)
          binary_sha256=unavailable
          binary="$GITHUB_WORKSPACE/zerofs/target/ci/zerofs"
          if [[ -f "$binary" ]]; then
            binary_sha256=$(sha256sum "$binary")
            binary_sha256=${binary_sha256%% *}
          fi
          {
            printf 'fixture=xfstests-nfs\nstorage_backend=s3\n'
            printf 'recorded_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'repository=%s\nworkflow=%s\njob=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_JOB"
            printf 'run_url=%s/%s/actions/runs/%s\nrun_attempt=%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'event=%s\nref=%s\ntrigger_sha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA"
            printf 'source_head_sha=%s\ncheckout_sha=%s\n' "$EVIDENCE_HEAD_SHA" "$checkout_sha"
            printf 'binary_artifact=zerofs-ci-bin\nbinary_artifact_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'binary_relative_path=zerofs/target/ci/zerofs\nbinary_sha256=%s\n' "$binary_sha256"
            printf 'job_status_before_collection=%s\n' "$EVIDENCE_JOB_STATUS"
          } > "$RUNNER_TEMP/zerofs-xfstests-nfs/provenance.txt"
          if [[ -d /tmp/xfstests/results ]]; then
            sudo cp -a /tmp/xfstests/results "$RUNNER_TEMP/zerofs-xfstests-nfs/"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/zerofs-xfstests-nfs/results"
          elif [[ "$EVIDENCE_JOB_STATUS" == success ]]; then
            echo "Successful xfstests run is missing /tmp/xfstests/results" >&2
            exit 1
          fi
          if [[ "$EVIDENCE_JOB_STATUS" != success ]]; then
            for log in "$RUNNER_TEMP/zerofs-xfstests-nfs"/zerofs-*.log; do
              [[ -f "$log" ]] || continue
              printf '\nLast server messages from %s:\n' "$(basename "$log")"
              tail -n 200 "$log" || true
            done
          fi

      - name: Upload xfstests evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerofs-xfstests-nfs
          path: ${{ runner.temp }}/zerofs-xfstests-nfs
          if-no-files-found: error

  xfstests-tiered:
    name: Run xfstests NFS Test Suite (tiered volatile_memory+ssd)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Disk space cleanup"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr automake bc dbench dump e2fsprogs fio gawk \
            gcc git indent libacl1-dev libaio-dev libcap-dev libgdbm-dev libtool \
            libtool-bin liburing-dev libuuid1 lvm2 make psmisc python3 quota sed \
            uuid-dev uuid-runtime xfsprogs linux-headers-$(uname -r) sqlite3 \
            libgdbm-compat-dev nfs-common

      - name: Fetch the prebuilt ZeroFS binary
        uses: actions/download-artifact@v4
        with:
          name: zerofs-ci-bin
          path: zerofs/target/ci
      - run: chmod +x zerofs/target/ci/zerofs

      - name: Build pinned MinIO fixture
        uses: ./.github/actions/build-minio-fixture
        with:
          docker-image: 'true'

      - name: Start MinIO
        run: |
          sudo docker load --input "$GITHUB_WORKSPACE/ci-minio-image.tar"
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            zerofs-minio-ci:local server /data

          # Wait for MinIO to be ready
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "MinIO failed to start after 30s" >&2
              exit 1
            fi
            sleep 1
          done

          # Install mc (MinIO client)
          chmod +x mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin
          ./mc mb myminio/zerofs-test || true

      - name: Prepare the tiered run roots
        run: |
          RUN_UUID=$(python3 -c "import uuid; print(uuid.uuid4())")
          CONTROL_ROOT="/var/tmp/zerofs-tiered-control-${RUN_UUID}"
          RESOURCE_ROOT="/var/tmp/zerofs-tiered-resources-${RUN_UUID}"
          {
            echo "RUN_UUID=${RUN_UUID}"
            echo "CONTROL_ROOT=${CONTROL_ROOT}"
            echo "RESOURCE_ROOT=${RESOURCE_ROOT}"
            echo "LEDGER=${CONTROL_ROOT}/ledger.json"
          } >> "$GITHUB_ENV"

      - name: Write the tiered ZeroFS config
        run: |
          cat > /tmp/zerofs-tiered.toml << EOF
          [cache]
          dir = "${RESOURCE_ROOT}/run/cache"
          disk_size_gb = 1.0
          memory_size_gb = 1.0

          [storage]
          url = "s3://zerofs-test/zerofs-tiered/${RUN_UUID}"
          encryption_password = "test-password-123"

          [filesystem]
          write_ack_mode = "volatile_memory"
          volatile_memory_gb = 1.0

          [writeback]
          enabled = true
          dir = "${RESOURCE_ROOT}/run/writeback"
          ack_mode = "ssd"
          memory_size_gb = 1.0
          disk_size_gb = 4.0

          [servers.nfs]
          addresses = ["127.0.0.1:12049"]

          [aws]
          access_key_id = "minioadmin"
          secret_access_key = "minioadmin"
          endpoint = "http://localhost:9000"
          allow_http = "true"

          [telemetry]
          enabled = false
          EOF

      - name: Set up the tiered harness run
        run: |
          python3 scripts/tiered-writeback-e2e.py setup \
            --run-uuid "$RUN_UUID" \
            --filesystem-ack-mode volatile_memory \
            --object-ack-mode ssd \
            --zerofs-binary "$GITHUB_WORKSPACE/zerofs/target/ci/zerofs" \
            --zerofs-config /tmp/zerofs-tiered.toml
          mkdir -p "${RESOURCE_ROOT}/run/cache" "${RESOURCE_ROOT}/run/writeback"

      - name: Run the tiered xfstests scenario
        run: |
          # Plan-only until the observed-durability collector is wired:
          # run_scenario fails closed on requires_observed_durability.
          python3 scripts/tiered-writeback-e2e.py run \
            --plan-only \
            --ledger "$LEDGER" \
            --scenario xfstests-nfs-quick \
            --filesystem-ack-mode volatile_memory \
            --object-ack-mode ssd \
            --zerofs-binary "$GITHUB_WORKSPACE/zerofs/target/ci/zerofs" \
            --zerofs-config /tmp/zerofs-tiered.toml

      - name: Clean up the tiered run
        if: always()
        run: |
          if [ -f "$LEDGER" ]; then
            python3 scripts/tiered-writeback-e2e.py cleanup --ledger "$LEDGER"
            python3 scripts/tiered-writeback-e2e.py cleanup --ledger "$LEDGER"
            python3 scripts/tiered-writeback-e2e.py assert-clean --ledger "$LEDGER"
          fi

name: case-insensitive-fuse

on:
  workflow_call:

permissions:
  contents: read

jobs:
  case-insensitive-fuse:
    name: Case-only rename and exact lookup over FUSE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install fuse3
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 attr
          # Runner image 20260804.265.1 ships a non-setuid helper in
          # /usr/local/bin that shadows the distro's setuid helper.
          sudo rm -f /usr/local/bin/fusermount3
          test "$(command -v fusermount3)" = /usr/bin/fusermount3

      - name: Fetch the prebuilt ZeroFS binary
        uses: actions/download-artifact@v4
        with:
          name: zerofs-ci-bin
          path: zerofs/target/ci
      - run: chmod +x zerofs/target/ci/zerofs

      # The script mounts an insensitive export and renames Foo to foo through
      # the mount. It fails unless the listing then shows only foo, lookups of Foo
      # and FOO miss, and creating FOO fails with EEXIST. It runs once strict and
      # once relaxed.
      - name: Run the mounted case-insensitive name checks
        timeout-minutes: 5
        run: python3 scripts/test-case-insensitive-fuse.py --binary zerofs/target/ci/zerofs

      # The xattr script is the only end-to-end check of empty replacement and
      # explicit removal through a real mount. It runs once with sensitive names
      # and once with insensitive names.
      - name: Run the mounted extended-attribute checks
        timeout-minutes: 5
        run: python3 scripts/test-xattrs-fuse.py --binary zerofs/target/ci/zerofs

[package]
name = "zerofs"
version.workspace = true
edition = "2024"
description = "A high-performance filesystem that makes S3 your primary storage with NFS, 9P, and NBD support"
license = "AGPL-3.0"
repository = "https://github.com/Barre/ZeroFS"
homepage = "https://www.zerofs.net"
documentation = "https://www.zerofs.net"
readme = "../README.md"
keywords = ["filesystem", "s3", "nfs", "distributed", "storage"]
categories = ["filesystem", "network-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dst)"] }

[workspace]
members = [
    "ninep-proto",
    "nbd-proto",
    "ninep-client",
    "zerofs-csi",
    "zerofs-client",
    "zerofs-client-web",
    "zerofs-ffi",
]

# Single source of truth for the release version. The zerofs-csi image is
# tagged with the repo release tag and layers on the zerofs image of that
# same release, so the version the driver reports (GetPluginInfo) must not
# drift from zerofs's.
[workspace.package]
version = "2.2.2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

# Release build with debug symbols preserved so `jeprof` can resolve Rust
# call sites in jemalloc heap dumps. Use with `--features heap-profiling`.
[profile.release-prof]
inherits = "release"
debug = "line-tables-only"
strip = false

# Python wheel build (maturin). Release-optimized but NOT stripped: maturin's
# uniffi-bindgen reads the binding metadata from the cdylib's symbols, which
# `strip = true` removes. Used by publish-client.yml's PyPI matrix.
[profile.wheel]
inherits = "release"
strip = false

[features]
default = ["vendored-protoc"]
tokio-console = ["dep:console-subscriber"]
failpoints = ["dep:fail"]
vendored-protoc = ["dep:protobuf-src"]
webui = ["dep:rust-embed", "dep:axum", "dep:tonic-web", "dep:tower-http"]


[dependencies]
ninep-proto = { path = "ninep-proto" }
nbd-proto = { path = "nbd-proto" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
console-subscriber = { version = "0.5", optional = true }
slatedb = { git = "https://github.com/Barre/slatedb.git", rev = "230ade681f1fdf0f85fc1c2cb6c118575a83ceb1", default-features = false, features = [
    "wal_disable",
    "foyer",
] }
slatedb-common = { git = "https://github.com/Barre/slatedb.git", rev = "230ade681f1fdf0f85fc1c2cb6c118575a83ceb1" }
zerofs_nfsserve = { git = "https://github.com/ScriptedAlchemy/nfsserve.git", rev = "0c19924faa3b09041d198d167785a7de80ea48b5" }
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = { version = "0.7", features = [
    "stats",
] }
tokio = { version = "1.49", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec", "rt", "time"] }
async-trait = "0.1"
backon = { version = "1.5", features = ["tokio-sleep"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
object_store = { version = "0.14.0", default-features = false, features = [
    "fs",
    "aws",
    "azure",
    "gcp",
] }
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
    "tls12",
    "logging",
] }
redis = { version = "1.0", default-features = false, features = ["tokio-comp", "script"] }
redb = "4.1.0"
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rand = "0.8"
rayon = "1.10"
futures = "0.3"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
lz4_flex = "0.12"
zstd = "0.13"
anyhow = "1.0"
arc-swap = "1.7"
argon2 = "0.5"
url = "2.5"
deku = "0.20"
thiserror = "2.0"
crc32c = "0.6"
comfy-table = "7.1"
num-format = "0.4"
libc = "0.2"
dashmap = "6.1"
uuid = { version = "1.17", features = ["v4", "serde"] }
toml = "0.9"
shellexpand = "3.1"
clap = { version = "4.5", features = ["derive"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
chrono = "0.4"
fail = { version = "0.5", features = ["failpoints"], optional = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
zerofs-client = { path = "zerofs-client" }
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
indicatif = "0.18.6"
rust-embed = { version = "8", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tonic-web = { version = "0.13", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
foyer = "0.22"
fs4 = "0.13.1"
openssh = "=0.11.6"
openssh-sftp-client = { version = "=0.15.7", features = ["openssh"] }
tempfile = "3.21"

# The `zerofs mount` FUSE client. default-features = false uses the pure-Rust
# mount path via the fusermount3 helper, so no libfuse linkage is required.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.17", default-features = false }
# The `zerofs mount` FUSE path uses the low-level 9P client directly.
ninep-client = { path = "ninep-client" }

[build-dependencies]
tonic-prost-build = "0.14"
protobuf-src = { version = "2", optional = true }

[dev-dependencies]
futures = "0.3"
indicatif = { version = "0.18.6", features = ["in_memory"] }
proptest = "1"
ninep-client = { path = "ninep-client" }
# start_paused virtual-time runtimes for the DST harness.
tokio = { version = "1.49", features = ["test-util"] }

[[test]]
name = "failpoints"
path = "tests/failpoints/mod.rs"
required-features = ["failpoints"]

[[test]]
name = "dst"
path = "tests/dst/mod.rs"
